name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ ms-pedidos360-bff, ms-pedidos360-catalog, ms-pedidos360-orders, ms-pedidos360-notifications, ms-pedidos360-kafka-admin, ms-pedidos360-rabbit-admin, ms-pedidos360-payments ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # Caché de Maven por microservicio: con una clave común solo un job de la matriz la guardaba y el resto
    # descargaba todo desde Maven Central en cada ejecución (y Central respondía 429).
    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ matrix.service }}-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
        restore-keys: m2-${{ matrix.service }}-

    # Si Maven Central responde 429 (Too Many Requests) se reintenta la descarga antes de los tests.
    - name: Download dependencies
      working-directory: ./${{ matrix.service }}
      run: |
        chmod +x mvnw
        for i in 1 2 3 4; do
          ./mvnw -B dependency:go-offline > deps.log 2>&1 && exit 0
          echo "::warning::Descarga de dependencias falló (intento $i): $(grep -m1 -E '\[ERROR\]' deps.log | cut -c1-300)"
          sleep $((i * 45))
        done
        tail -n 40 deps.log
        exit 1

    - name: Run tests
      working-directory: ./${{ matrix.service }}
      run: ./mvnw -B test

    # Deja el motivo de cada test fallido como annotation (visible sin abrir el log).
    - name: Report test failures
      if: failure()
      working-directory: ./${{ matrix.service }}
      run: |
        for f in target/surefire-reports/*.txt; do
          [ -f "$f" ] || continue
          if grep -qE "(FAILURE|ERROR)!" "$f"; then
            msg=$(grep -E -A6 "<<< (FAILURE|ERROR)!" "$f" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.service }} $(basename "$f" .txt)::${msg}"
          fi
        done

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-${{ matrix.service }}
        path: ${{ matrix.service }}/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-pedidos360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-pedidos360/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Unit tests (Vitest)
      run: npm test

    - name: Production build (Angular)
      run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        # Una imagen por job: si falla, el nombre del job indica cuál y el error queda como annotation.
        service: [ bff, catalog, orders, notifications, payments, frontend, kafka-admin, rabbit-admin ]
    permissions:
      contents: read
      packages: write
    env:
      # En push a main las imágenes se publican en GHCR (las despliega deploy.yml en AWS).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Solo el frontend usa valores al compilar (identificadores públicos de Entra ID y la URL de la API).
    # En main la imagen es la que se despliega en AWS, así que apunta a API Gateway (variable CLOUD_URL).
    - name: Create .env file from GitHub Secrets
      env:
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
        API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
        ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        CLOUD_URL: ${{ vars.CLOUD_URL }}
      run: |
        registry="ghcr.io/${{ github.repository_owner }}/pedidos360"
        echo "IMAGE_REGISTRY=${registry,,}" >> "$GITHUB_ENV"
        if [ "$PUBLISH" = true ] && [ -n "$CLOUD_URL" ]; then mode=cloud; else mode=local; fi
        bash infra/scripts/write-env.sh infra/.env "$mode"

    - name: Build Docker image (${{ matrix.service }})
      working-directory: ./infra
      run: |
        # Reintenta si Maven Central o npm limitan las descargas (429) durante el build.
        ok=false
        for i in 1 2 3; do
          if docker compose --progress=plain build ${{ matrix.service }} > build.log 2>&1; then ok=true; break; fi
          grep -qE "429|Too Many Requests|ETIMEDOUT|Could not transfer" build.log || break
          echo "::warning::Build de ${{ matrix.service }} falló por la red (intento $i), reintentando en $((i * 30)) s"
          sleep $((i * 30))
        done
        if [ "$ok" != true ]; then
          cat build.log
          # Últimas líneas del error como annotation (visible en el resumen de la ejecución).
          msg=$(grep -v -- '-----' build.log | tail -n 25 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build ${{ matrix.service }} falló::${msg}"
          exit 1
        fi
        tail -n 5 build.log

    - name: Push image to GHCR (${{ matrix.service }})
      if: env.PUBLISH == 'true'
      working-directory: ./infra
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        image="$IMAGE_REGISTRY/${{ matrix.service }}"
        docker compose push ${{ matrix.service }}
        docker tag "$image:$IMAGE_TAG" "$image:latest"
        docker push "$image:latest"
