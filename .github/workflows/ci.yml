name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ ms-pedidos360-bff, ms-pedidos360-catalog, ms-pedidos360-orders, ms-pedidos360-notifications, ms-pedidos360-kafka-admin, ms-pedidos360-rabbit-admin ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Run tests
      working-directory: ./${{ matrix.service }}
      run: |
        chmod +x mvnw
        ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-pedidos360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-pedidos360/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Unit tests (Vitest)
      run: npm test

    - name: Production build (Angular)
      run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        # Una imagen por job: si falla, el nombre del job indica cuál y el error queda como annotation.
        service: [ bff, catalog, orders, notifications, frontend, kafka-admin, rabbit-admin ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file from GitHub Secrets
      working-directory: ./infra
      run: |
        echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        echo "AZURE_AD_TENANT_ID=${{ secrets.AZURE_AD_TENANT_ID }}" >> .env
        echo "AZURE_AD_CLIENT_ID=${{ secrets.AZURE_AD_CLIENT_ID }}" >> .env
        echo "API_CLIENT_ID=${{ secrets.API_CLIENT_ID }}" >> .env
        echo "VITE_BFF_URL=${{ secrets.VITE_BFF_URL }}" >> .env

    - name: Build Docker image (${{ matrix.service }})
      working-directory: ./infra
      run: |
        if ! docker compose --progress=plain build ${{ matrix.service }} > build.log 2>&1; then
          cat build.log
          # Últimas líneas del error como annotation (visible en el resumen de la ejecución).
          msg=$(grep -v -- '-----' build.log | tail -n 25 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build ${{ matrix.service }} falló::${msg}"
          exit 1
        fi
        tail -n 5 build.log
