spring.application.name=ms-pedidos360-kafka-admin
server.address=${KAFKA_ADMIN_BIND_ADDRESS:127.0.0.1}
server.port=8084
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.admin.properties[default.api.timeout.ms]=10000
spring.kafka.admin.properties[request.timeout.ms]=5000
# JWT de Microsoft Entra ID: el token debe tener aud = API_CLIENT_ID y rol Admin.
app.security.api-client-id=${API_CLIENT_ID:}
app.security.admin-emails=${ADMIN_EMAILS:gi.olavarria@duocuc.cl}
app.security.admin-tenant-id=${ADMIN_TENANT_ID:}
management.endpoints.web.exposure.include=health,info
