server:
  port: 8083

spring:
  application:
    name: ms-pedidos360-notifications
  rabbitmq:
    # Lista de nodos del cluster: si uno cae, el cliente se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Si falla el envío del correo se reintenta 4 veces (2s, 4s, 8s) y luego va a la DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s
  # Servidor SMTP. Por defecto MailHog (bandeja de pruebas en http://localhost:8025).
  # Para correos reales (p. ej. Gmail) definir MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD,
  # MAIL_SMTP_AUTH=true y MAIL_SMTP_STARTTLS=true.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

app:
  mail:
    from: ${MAIL_FROM:Pedidos360 <noreply@pedidos360.com>}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
# Perfil local: desarrollo directo en la maquina (sin Docker)
spring:
  config:
    activate:
      on-profile: local
  devtools:
    restart:
      enabled: true

---
# Perfil docker: contenedor dentro de docker compose
spring:
  config:
    activate:
      on-profile: docker
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672}
  mail:
    host: ${MAIL_HOST:mailhog}
