server {
    listen 80;
    server_name _;

    # Carpeta raíz donde Vite deposita el build.
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre (chunk-xxxx.js, index-xxxx.css):
    # se cachean agresivamente en el cliente (1 año) porque el hash
    # cambia automáticamente con cada build de Vite.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta que no sea un archivo existente
    # se resuelve con index.html para que react-router maneje la navegación.
    # Esto evita el 404 al refrescar /orders, /catalog, /dashboard, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
