spring.application.name=ms-pedidos360-rabbit-admin
server.address=${RABBIT_ADMIN_BIND_ADDRESS:127.0.0.1}
server.port=8086
# Conexión AMQP (declarar/eliminar) a cualquiera de los nodos del clúster.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# API HTTP de administración (listar recursos).
app.rabbitmq.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
# JWT de Microsoft Entra ID: el token debe tener aud = API_CLIENT_ID y rol Admin.
app.security.api-client-id=${API_CLIENT_ID:}
app.security.admin-emails=${ADMIN_EMAILS:gi.olavarria@duocuc.cl}
app.security.admin-tenant-id=${ADMIN_TENANT_ID:}
management.endpoints.web.exposure.include=health,info
