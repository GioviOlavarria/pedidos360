server:
  port: 8080

spring:
  application:
    name: ms-pedidos360-bff

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    # App Registration de la API. El token debe tener aud = este client id.
    api-client-id: ${API_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  services:
    orders:
      url: ${ORDERS_SERVICE_URL:http://localhost:8081}
    catalog:
      url: ${CATALOG_SERVICE_URL:http://localhost:8082}

---
# Perfil docker: contenedor dentro de docker compose
spring:
  config:
    activate:
      on-profile: docker

app:
  services:
    orders:
      url: ${ORDERS_SERVICE_URL:http://orders:8081}
    catalog:
      url: ${CATALOG_SERVICE_URL:http://catalog:8082}
