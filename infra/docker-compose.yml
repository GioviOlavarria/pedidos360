name: pedidos360
services:

  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE:      pedidos360_db
      MYSQL_USER:          ${DB_USER:-pedidos360user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-pedidos360pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # ── Cluster RabbitMQ de 3 nodos ─────────────────────────────────────────────
  # Las colas del flujo de boletas son quorum: se replican en los 3 nodos.
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment: &rabbit-env
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pedidos360-net
    healthcheck: &rabbit-health
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  orders:
    build:
      context: ../ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SERVICE_URL: http://catalog:8082
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  catalog:
    build:
      context: ../ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SEED:   ${CATALOG_SEED:-true}
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  bff:
    build:
      context: ../ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    restart: unless-stopped
    depends_on:
      orders:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDERS_SERVICE_URL:  http://orders:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      API_CLIENT_ID:       ${API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ../frontend-pedidos360
      dockerfile: Dockerfile
      args:
        VITE_BFF_URL:              ${VITE_BFF_URL}
        VITE_AZURE_AD_CLIENT_ID:   ${AZURE_AD_CLIENT_ID}
        VITE_AZURE_AD_TENANT_ID:   ${AZURE_AD_TENANT_ID}
        VITE_API_CLIENT_ID:        ${API_CLIENT_ID}
        VITE_ADMIN_EMAIL:          ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
    container_name: pedidos360-frontend
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - pedidos360-net
  
  # ── Apache Kafka Broker (Modo KRaft - sin ZooKeeper) ──────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: pedidos360-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      CLUSTER_ID: '4L622nShTZaJvtkiqMreZw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      pedidos360-net:
        aliases:
          - kafka
          - pedidos360-kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 && /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Kafka UI: Interfaz gráfica de administración ──────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      SERVER_PORT: 8080
      KAFKA_CLUSTERS_0_NAME: pedidos360-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,pedidos360-kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'false'
      KAFKA_CLUSTERS_0_PROPERTIES_RETRIES: 5
      KAFKA_CLUSTERS_0_PROPERTIES_RETRY_BACKOFF_MS: 1000
    networks:
      - pedidos360-net

  notifications:
    build:
      context: ../ms-pedidos360-notifications
      dockerfile: Dockerfile
    container_name: pedidos360-notifications
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
      # SMTP: por defecto MailHog (ver correos en http://localhost:8025).
      # Para enviar correos reales define MAIL_* en infra/.env (ver README).
      MAIL_HOST:          ${MAIL_HOST:-mailhog}
      MAIL_PORT:          ${MAIL_PORT:-1025}
      MAIL_USERNAME:      ${MAIL_USERNAME:-}
      MAIL_PASSWORD:      ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH:     ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM:          ${MAIL_FROM:-Pedidos360 <noreply@pedidos360.com>}
    ports:
      - "8083:8083"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pedidos360-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pedidos360-net
volumes:
  mysql-data:
    driver: local
  kafka-data:
    driver: local
networks:
  pedidos360-net:
    driver: bridge
