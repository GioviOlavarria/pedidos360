name: pedidos360
services:

  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE:      pedidos360_db
      MYSQL_USER:          ${DB_USER:-pedidos360user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-pedidos360pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pedidos360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pedidos360-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  orders:
    build:
      context: ../ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      API_CLIENT_ID:  ${API_CLIENT_ID}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  catalog:
    build:
      context: ../ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      API_CLIENT_ID:  ${API_CLIENT_ID}
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  bff:
    build:
      context: ../ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    restart: unless-stopped
    depends_on:
      orders:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDERS_SERVICE_URL:  http://orders:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      JWT_ISSUER_URI:      ${JWT_ISSUER_URI}
      API_CLIENT_ID:       ${API_CLIENT_ID}
      AZURE_AD_TENANT_ID:  ${AZURE_AD_TENANT_ID}
      AZURE_AD_CLIENT_ID:  ${AZURE_AD_CLIENT_ID}
    ports:
      - "8080:8080"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ../frontend-pedidos360
      dockerfile: Dockerfile
      args:
        VITE_BFF_URL:              ${VITE_BFF_URL}
        VITE_AZURE_AD_CLIENT_ID:   ${AZURE_AD_CLIENT_ID}
        VITE_AZURE_AD_TENANT_ID:   ${AZURE_AD_TENANT_ID}
        VITE_API_CLIENT_ID:        ${API_CLIENT_ID}
        VITE_ADMIN_EMAIL:          ${VITE_ADMIN_EMAIL:-gi.olavarria@duocuc.cl}
    container_name: pedidos360-frontend
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - pedidos360-net
volumes:
  mysql-data:
    driver: local
networks:
  pedidos360-net:
    driver: bridge
