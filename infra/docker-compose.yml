name: pedidos360

# ── Plantillas del clúster Kafka (ZooKeeper + 2 brokers) ──────────────────────
x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.9.11
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy
  networks:
    - pedidos360-net
  healthcheck:
    test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-environment: &kafka-environment
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  # INTERNAL: tráfico entre contenedores; EXTERNAL: clientes en el host (localhost:9092/9093).
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  # Con 2 réplicas, min ISR 1 permite seguir escribiendo (acks=all) si cae un broker.
  KAFKA_MIN_INSYNC_REPLICAS: 1
  # Los tópicos se crean explícitamente (kafka-init / NewTopic) con su configuración.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_LOG_RETENTION_HOURS: 168

x-kafka-client-env: &kafka-client-env
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29092
services:

  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE:      pedidos360_db
      MYSQL_USER:          ${DB_USER:-pedidos360user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-pedidos360pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # ── Cluster RabbitMQ de 3 nodos ─────────────────────────────────────────────
  # Las colas del flujo de boletas son quorum: se replican en los 3 nodos.
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment: &rabbit-env
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pedidos360-net
    healthcheck: &rabbit-health
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  # API REST para crear/eliminar colas, exchanges y bindings del clúster RabbitMQ (puerto 8086).
  rabbit-admin:
    build:
      context: ../ms-pedidos360-rabbit-admin
      dockerfile: Dockerfile
    container_name: pedidos360-rabbit-admin
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment:
      RABBIT_ADMIN_BIND_ADDRESS: 0.0.0.0
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq1:15672
    ports:
      - "127.0.0.1:${RABBIT_ADMIN_PORT:-8086}:8086"
    networks:
      - pedidos360-net

  orders:
    build:
      context: ../ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SERVICE_URL: http://catalog:8082
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  catalog:
    build:
      context: ../ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SEED:   ${CATALOG_SEED:-true}
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  bff:
    build:
      context: ../ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    restart: unless-stopped
    depends_on:
      orders:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDERS_SERVICE_URL:  http://orders:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      API_CLIENT_ID:       ${API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ../frontend-pedidos360
      dockerfile: Dockerfile
      # Frontend Angular: los valores se incrustan en el bundle al compilar (scripts/set-env.mjs).
      args:
        BFF_URL:            ${BFF_URL:-${VITE_BFF_URL:-http://localhost:8080}}
        AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
        AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
        API_CLIENT_ID:      ${API_CLIENT_ID}
        ADMIN_EMAILS:       ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
    container_name: pedidos360-frontend
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - pedidos360-net

  notifications:
    build:
      context: ../ms-pedidos360-notifications
      dockerfile: Dockerfile
    container_name: pedidos360-notifications
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      <<: *kafka-client-env
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
      # SMTP: por defecto MailHog (ver correos en http://localhost:8025).
      # Para enviar correos reales define MAIL_* en infra/.env (ver README).
      MAIL_HOST:          ${MAIL_HOST:-mailhog}
      MAIL_PORT:          ${MAIL_PORT:-1025}
      MAIL_USERNAME:      ${MAIL_USERNAME:-}
      MAIL_PASSWORD:      ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH:     ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM:          ${MAIL_FROM:-Pedidos360 <noreply@pedidos360.com>}
      # Boleta electrónica: modo simulado del SII (ver ms-pedidos360-notifications/sii).
      SII_MODE:           ${SII_MODE:-simulado}
      SII_RUT_EMISOR:     ${SII_RUT_EMISOR:-76123456-7}
    ports:
      - "8083:8083"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pedidos360-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pedidos360-net

  # ── Clúster Kafka: ZooKeeper + 2 brokers ────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.11
    container_name: pedidos360-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - kafka-zookeeper-data:/var/lib/zookeeper/data
      - kafka-zookeeper-log:/var/lib/zookeeper/log
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

  kafka:
    <<: *kafka-broker
    container_name: pedidos360-kafka1
    hostname: kafka
    environment:
      <<: *kafka-environment
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-broker
    container_name: pedidos360-kafka2
    hostname: kafka2
    environment:
      <<: *kafka-environment
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9093
    ports:
      - "127.0.0.1:9093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  # Crea (o alinea) los tópicos de la aplicación con su configuración. Ver infra/kafka/create-topics.sh.
  kafka-init:
    image: confluentinc/cp-kafka:7.9.11
    container_name: pedidos360-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092,kafka2:29092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    networks:
      - pedidos360-net

  # API REST para administrar tópicos, configuraciones, brokers y consumer groups (puerto 8084).
  kafka-admin:
    build:
      context: ../ms-pedidos360-kafka-admin
      dockerfile: Dockerfile
    container_name: pedidos360-kafka-admin
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_ADMIN_BIND_ADDRESS: 0.0.0.0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29092
    ports:
      - "127.0.0.1:${KAFKA_ADMIN_PORT:-8084}:8084"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/api/brokers"]
      interval: 10s
      timeout: 12s
      retries: 10
      start_period: 20s

  # Kafka UI: brokers, tópicos, mensajes y consumer groups (http://localhost:8085).
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka2:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - pedidos360-net

volumes:
  kafka-zookeeper-data:
  kafka-zookeeper-log:
  kafka-1-data:
  kafka-2-data:
  mysql-data:
    driver: local
networks:
  pedidos360-net:
    driver: bridge
