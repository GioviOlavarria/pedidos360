name: pedidos360
services:

  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE:      pedidos360_db
      MYSQL_USER:          ${DB_USER:-pedidos360user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-pedidos360pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # ── Cluster RabbitMQ de 3 nodos ─────────────────────────────────────────────
  # Las colas del flujo de boletas son quorum: se replican en los 3 nodos.
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment: &rabbit-env
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - pedidos360-net
    healthcheck: &rabbit-health
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  rabbitmq3:
    image: rabbitmq:3-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    restart: unless-stopped
    environment: *rabbit-env
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - pedidos360-net
    healthcheck: *rabbit-health

  orders:
    build:
      context: ../ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SERVICE_URL: http://catalog:8082
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  catalog:
    build:
      context: ../ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:         ${DB_URL:-jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USER:        ${DB_USER:-pedidos360user}
      DB_PASSWORD:    ${DB_PASSWORD:-pedidos360pass}
      API_CLIENT_ID:  ${API_CLIENT_ID}
      ADMIN_EMAILS:   ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-pedidos360-internal-dev-key}
      CATALOG_SEED:   ${CATALOG_SEED:-true}
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  bff:
    build:
      context: ../ms-pedidos360-bff
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    restart: unless-stopped
    depends_on:
      orders:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDERS_SERVICE_URL:  http://orders:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      API_CLIENT_ID:       ${API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ../frontend-pedidos360
      dockerfile: Dockerfile
      args:
        VITE_BFF_URL:              ${VITE_BFF_URL}
        VITE_AZURE_AD_CLIENT_ID:   ${AZURE_AD_CLIENT_ID}
        VITE_AZURE_AD_TENANT_ID:   ${AZURE_AD_TENANT_ID}
        VITE_API_CLIENT_ID:        ${API_CLIENT_ID}
        VITE_ADMIN_EMAIL:          ${ADMIN_EMAILS:-gi.olavarria@duocuc.cl}
    container_name: pedidos360-frontend
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - pedidos360-net

  notifications:
    build:
      context: ../ms-pedidos360-notifications
      dockerfile: Dockerfile
    container_name: pedidos360-notifications
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      rabbitmq3:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBITMQ_USER:     ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360rabbit}
      # SMTP: por defecto MailHog (ver correos en http://localhost:8025).
      # Para enviar correos reales define MAIL_* en infra/.env (ver README).
      MAIL_HOST:          ${MAIL_HOST:-mailhog}
      MAIL_PORT:          ${MAIL_PORT:-1025}
      MAIL_USERNAME:      ${MAIL_USERNAME:-}
      MAIL_PASSWORD:      ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH:     ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM:          ${MAIL_FROM:-Pedidos360 <noreply@pedidos360.com>}
    ports:
      - "8083:8083"
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pedidos360-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pedidos360-net
volumes:
  mysql-data:
    driver: local
networks:
  pedidos360-net:
    driver: bridge
