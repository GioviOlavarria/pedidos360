server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  rabbitmq:
    # Lista de nodos del cluster: si uno cae, el cliente se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    # App Registration de la API (BFF). El token debe tener aud = este client id.
    api-client-id: ${API_CLIENT_ID:}
    # Correos (separados por coma) que entran con rol Admin. El resto es Customer.
    admin-emails: ${ADMIN_EMAILS:gi.olavarria@duocuc.cl}
    # Opcional: exigir además que el Admin pertenezca a este tenant (recomendado).
    admin-tenant-id: ${ADMIN_TENANT_ID:}
  internal:
    # Clave compartida para llamadas servicio a servicio (orders -> catalog).
    api-key: ${INTERNAL_API_KEY:}
  services:
    catalog:
      url: ${CATALOG_SERVICE_URL:http://localhost:8082}

---
# Perfil local: desarrollo directo en la máquina (sin Docker)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  devtools:
    restart:
      enabled: true

---
# Perfil docker: contenedor dentro de docker compose
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672}
