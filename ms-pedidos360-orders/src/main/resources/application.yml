server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  # ── Cliente Kafka (clúster ZooKeeper + 2 brokers de infra/docker-compose.yml) ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    client-id: ms-pedidos360-orders
    admin:
      # Crea los tópicos declarados como NewTopic y alinea su configuración si alguien la cambió.
      auto-create: true
      modify-topic-configs: true
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all + idempotencia: el mensaje queda en todas las réplicas en sincronía y sin duplicados por reintentos.
      acks: all
      retries: 10
      compression-type: lz4
      batch-size: 16384
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        # Tiempo máximo que send() bloquea el hilo HTTP si no hay metadata del clúster.
        max.block.ms: 3000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        spring.json.add.type.headers: false
    consumer:
      # Grupo propio: orders recibe todas las boletas emitidas (las 3 particiones se reparten entre sus hilos).
      group-id: pedidos360-orders
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer evita que un mensaje corrupto ("poison pill") bloquee la partición.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 100
      isolation-level: read-committed
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.pedidos360.orders.messaging.kafka.ReceiptIssuedMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.pedidos360.*
        allow.auto.create.topics: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 15000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000
    listener:
      # Commit del offset después de procesar cada registro (at-least-once).
      ack-mode: record
      missing-topics-fatal: false
  rabbitmq:
    # Lista de nodos del cluster: si uno cae, el cliente se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  kafka:
    # En Docker se activa con KAFKA_ENABLED=true. Tópicos: ver messaging/kafka/KafkaTopics.
    enabled: ${KAFKA_ENABLED:false}
    # Hilos consumidores = particiones del tópico (3).
    listener-concurrency: 3
  security:
    # App Registration de la API (BFF). El token debe tener aud = este client id.
    api-client-id: ${API_CLIENT_ID:}
    # Correos (separados por coma) que entran con rol Admin. El resto es Customer.
    admin-emails: ${ADMIN_EMAILS:gi.olavarria@duocuc.cl}
    # Opcional: exigir además que el Admin pertenezca a este tenant (recomendado).
    admin-tenant-id: ${ADMIN_TENANT_ID:}
  payments:
    # Plazo para pagar un pedido antes de cancelarlo y devolver el stock.
    expiration: ${PAYMENT_EXPIRATION:PT30M}
  internal:
    # Clave compartida para llamadas servicio a servicio (orders -> catalog, payments -> orders).
    api-key: ${INTERNAL_API_KEY:}
  services:
    catalog:
      url: ${CATALOG_SERVICE_URL:http://localhost:8082}

---
# Perfil local: desarrollo directo en la máquina (sin Docker)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  devtools:
    restart:
      enabled: true

---
# Perfil docker: contenedor dentro de docker compose
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/pedidos360_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672}
